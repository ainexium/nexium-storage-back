services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexium
      POSTGRES_PASSWORD: nexium
      POSTGRES_DB: nexium_storage
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexium"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
